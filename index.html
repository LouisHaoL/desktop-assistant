<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面小助理</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="toasts"></div>

    <!-- 以下仅主窗口显示 -->
    <nav class="tabs">
      <button class="tab active" data-tab="pool">任务池</button>
      <button class="tab" data-tab="new">＋ 新增任务</button>
      <button class="tab" data-tab="review">复盘</button>
      <button class="tab" data-tab="settings">设置</button>
    </nav>

    <!-- ===== 任务池 ===== -->
    <section id="page-pool" class="page">
      <div id="doing-banner" hidden>
        <span class="pulse"></span>
        <div class="doing-info">
          <div class="doing-label">进行中</div>
          <div id="doing-name"></div>
        </div>
        <button id="btn-finish" class="btn-primary">完成</button>
      </div>
      <ul id="task-list"></ul>
      <p id="empty-hint" class="empty" hidden>任务池是空的,点上方「＋ 新增任务」添加一个吧</p>
    </section>

    <!-- ===== 新增任务 ===== -->
    <section id="page-new" class="page" hidden>
      <div class="ai-box">
        <div class="ai-title">✨ AI 快速创建</div>
        <textarea id="ai-text" rows="3" placeholder="用大白话描述,比如:
  每个工作日早上9点背单词半小时
  明天下午3点开周会,准备汇报材料"></textarea>
        <div class="ai-row">
          <span id="ai-msg" class="hint"></span>
          <button id="btn-ai-parse" class="btn-primary">AI 解析并创建</button>
        </div>
      </div>
      <div class="divider">或手动填写</div>

      <form id="task-form">
        <div class="field">
          <label>任务名</label>
          <input id="task-name" placeholder="比如:背单词 / 写周报" required />
        </div>

        <div class="field">
          <label>任务内容(可选,详细说明)</label>
          <textarea id="task-content" rows="3" placeholder="具体做什么、链接、注意事项…"></textarea>
        </div>

        <div class="field">
          <label>类型</label>
          <div class="segmented">
            <label><input type="radio" name="kind" value="once" checked /><span>一次性</span></label>
            <label><input type="radio" name="kind" value="recurring" /><span>周期性</span></label>
          </div>
        </div>

        <div class="field" id="field-due">
          <label>什么时候做</label>
          <input id="task-due" type="datetime-local" />
        </div>

        <div class="field" id="field-cron" hidden>
          <label>周期规则(cron)</label>
          <input id="task-cron" placeholder="0 9 * * 1-5  =  工作日每天 9:00" />
          <div class="hint">分 时 日 月 周。工作日9点:<code>0 9 * * 1-5</code>,每天9点:<code>0 9 * * *</code></div>
        </div>

        <div class="field">
          <label>预估时长(分钟)</label>
          <input id="task-est" type="number" min="1" placeholder="30" />
        </div>

        <p id="task-err" class="err"></p>
        <div class="form-actions">
          <button type="button" id="btn-cancel" class="btn-ghost">取消</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </form>
    </section>

    <!-- ===== 复盘 ===== -->
    <section id="page-review" class="page" hidden>
      <div id="review-stats" class="stats-box" hidden></div>
      <div class="form-actions">
        <button id="btn-ai-review" class="btn-primary">✨ AI 生成今日复盘</button>
      </div>
      <div id="review-out" class="review-out"></div>
    </section>

    <!-- ===== 设置 ===== -->
    <section id="page-settings" class="page" hidden>
      <div class="settings-card">
        <h3>LLM 服务商</h3>
        <div class="field">
          <label>预设</label>
          <select id="set-preset"></select>
        </div>
        <div class="field">
          <label>Base URL(OpenAI 兼容)</label>
          <input id="set-baseurl" placeholder="https://api.deepseek.com" />
        </div>
        <div class="field">
          <label>模型</label>
          <input id="set-model" list="set-models" placeholder="deepseek-chat" />
          <datalist id="set-models"></datalist>
        </div>
        <div class="field">
          <label>API Key(Ollama 等本地服务可留空)</label>
          <input id="set-key" type="password" placeholder="sk-…" />
        </div>
        <div class="form-actions">
          <button id="set-test" class="btn-ghost">测试连接</button>
          <button id="set-save" class="btn-primary">保存</button>
        </div>
        <p id="set-msg" class="hint"></p>
      </div>

      <div class="settings-card">
        <h3>空闲提醒</h3>
        <div class="field">
          <label>键鼠无操作多少分钟后提醒(1-120)</label>
          <input id="set-threshold" type="number" min="1" max="120" placeholder="15" />
        </div>
      </div>
    </section>

    <!-- 时间轴 / 桌宠 / 空闲弹窗的挂载点 -->
    <div id="view-root" hidden></div>
  </body>
</html>
